# =============================================================================
# kangkan.dev — nginx
#
# For a VPS, Cloudways or any nginx host. Save as
# /etc/nginx/sites-available/kangkan.dev, symlink into sites-enabled, then:
#   nginx -t && systemctl reload nginx
#
# Point `root` at the directory you upload out/ into.
#
# Note: caching is driven by the map below rather than an add_header inside a
# location. nginx drops every server-level add_header as soon as a location
# declares its own, which would silently strip HSTS from HTML responses.
# =============================================================================

map $uri $cache_control {
    default          "public, max-age=0, must-revalidate";
    ~^/_next/static/ "public, max-age=31536000, immutable";
}

# --- HTTP: everything is upgraded, and www goes straight to the bare domain ---
server {
    listen 80;
    listen [::]:80;
    server_name kangkan.dev www.kangkan.dev;
    return 301 https://kangkan.dev$request_uri;
}

# --- www -> non-www ---------------------------------------------------------
server {
    # `http2 on;` needs nginx 1.25.1+. On older builds use:
    #   listen 443 ssl http2;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kangkan.dev;

    ssl_certificate     /etc/letsencrypt/live/kangkan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kangkan.dev/privkey.pem;

    return 301 https://kangkan.dev$request_uri;
}

# --- Canonical host ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kangkan.dev;

    root  /var/www/kangkan.dev;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/kangkan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kangkan.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: .dev is on the preload list, so this must never be served over HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control             $cache_control always;

    # --- Compression: the main performance lever ---------------------------
    # woff2 is already compressed, so it is deliberately absent from both lists.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml application/manifest+json;

    # Brotli beats gzip by ~15%. Uncomment if ngx_brotli is compiled in.
    # brotli            on;
    # brotli_comp_level 6;
    # brotli_types      text/plain text/css text/xml text/javascript
    #                   application/javascript application/json application/xml
    #                   image/svg+xml application/manifest+json;

    # Fingerprinted build output.
    location ^~ /_next/static/ {
        try_files $uri =404;
    }

    # Trailing-slash URLs resolve to the exported directory index.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Let the certificate challenge through untouched.
    location ^~ /.well-known/ {
        allow all;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Never serve dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/kangkan.dev.access.log;
    error_log  /var/log/nginx/kangkan.dev.error.log;
}
