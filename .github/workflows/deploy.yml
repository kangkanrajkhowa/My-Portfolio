name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Build without a base path first so the exported site can be served
      # from the root during tests.
      - name: Build (test)
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4173
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Résumé PDF
        run: npm run pdf

      - name: End-to-end tests
        run: npm run e2e

      - name: Resolve site URL
        id: site
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "site_url=https://${{ vars.CUSTOM_DOMAIN }}" >> "$GITHUB_OUTPUT"
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (deploy)
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          touch out/.nojekyll
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > out/CNAME
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
